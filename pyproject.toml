[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shipboard"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "evdev; platform_system == 'Linux'",
]

[project.scripts]
shipboard = "shipboard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
